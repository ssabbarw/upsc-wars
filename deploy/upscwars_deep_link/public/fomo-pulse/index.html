<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open CA Shot — UPSC Wars</title>
  <style>
    :root { color-scheme: light; --bg: #FBF8F1; --ink: #10312E; --teal: #1D9E75; --muted: #3E5A55; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 420px; width: 100%; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 12px 40px rgba(16,49,46,.08); text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin: 0 0 18px; }
    a.btn { display: inline-block; background: var(--teal); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 999px; }
    .err { color: #B23A2E; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Opening CA Shot…</h1>
    <p id="msg">Launching UPSC Wars</p>
    <a id="openBtn" class="btn" href="#" hidden>Open in app</a>
    <p id="err" class="err" hidden>Invalid CA Shot link.</p>
  </div>
  <script>
(function () {
  var uuidRe = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
  var segs = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  var id = ((segs[0] === 'ca-shot' || segs[0] === 'fomo-pulse') && segs[1]) ? segs[1] : null;
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var openBtn = document.getElementById('openBtn');
  var err = document.getElementById('err');
  if (!id || !uuidRe.test(id)) {
    title.textContent = 'Link not found';
    msg.hidden = true;
    err.hidden = false;
    return;
  }
  var appUrl = 'upscwars://fomo-pulse/' + id;
  openBtn.href = appUrl;
  openBtn.hidden = false;
  msg.textContent = 'If nothing happens, tap Open in app.';
  window.location.replace(appUrl);
  setTimeout(function () {
    title.textContent = 'Open this CA Shot in UPSC Wars';
  }, 1200);
})();
  </script>
</body>
</html>
