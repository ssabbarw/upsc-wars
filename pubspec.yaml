name: upsc_wars
description: "A new Flutter project."
publish_to: 'none'

version: 2044.0.1+2044

environment:
  sdk: ^3.11.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  google_fonts: ^8.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  path: ^1.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^4.1.0
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.2
  firebase_crashlytics: ^5.0.2
  firebase_auth: ^6.0.2
  google_sign_in: ^7.2.0
  sign_in_button: ^4.1.0
  sign_in_with_apple: ^7.0.1
  cloud_firestore: ^6.3.0
  firebase_database: ^12.0.2
  firebase_messaging: ^16.0.2
  cloud_functions: ^6.0.2
  url_launcher: ^6.3.2
  in_app_review: ^2.0.10
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0
  flutter_widget_from_html: ^0.15.3
  webview_flutter: ^4.13.0
  workmanager: ^0.9.0+3
  firebase_in_app_messaging: ^0.9.2
  app_links: ^6.4.1
  share_plus: ^13.0.0
  firebase_remote_config: ^6.4.0
  cached_network_image: ^3.4.1
  firebase_storage: ^13.3.0
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  image: ^4.8.0
  flutter_web_auth_2: ^5.0.2
  app_settings: ^7.0.0
  wakelock_plus: ^1.6.0
  purchases_flutter: ^10.16.0
  posthog_flutter: ^5.55.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  drift_dev: ^2.31.0

dependency_overrides:
  # `sign_in_button` 4.1.0 expects FontAwesome icons to be `IconData`.
  # `font_awesome_flutter` 11.x changed icon typing (FaIconData), which breaks compilation.
  font_awesome_flutter: ^10.7.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_icon.png
    - assets/db/upsc_wars_questions.db
    - assets/data/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/daily_war/badges/
    - assets/mini_games/
    - google_fonts/