name: Store release

# A merged pull request into release runs both uploads.
# Actions → Store release → Run workflow can run Android, iOS, or both.
# Android goes to the Play production track.
# iOS is submitted for App Store review and released after Apple approves it.

on:
  pull_request:
    types: [closed]
    branches: [release]
  workflow_dispatch:
    inputs:
      platform:
        description: Which store upload to run
        required: true
        type: choice
        default: both
        options:
          - android
          - ios
          - both

permissions:
  contents: read

concurrency:
  group: store-release-${{ github.ref }}-${{ github.event.inputs.platform || 'merged' }}
  cancel-in-progress: false

jobs:
  android:
    if: >-
      github.event.pull_request.merged == true ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'android' || inputs.platform == 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Require a merge commit
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ github.event.pull_request.merge_commit_sha }}" ]; then
            echo "This merge did not create a merge commit."
            echo "Merge into release with a merge commit or squash merge."
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # Local builds use Homebrew OpenJDK 21 and Flutter 3.47.2.
      # The app still compiles to Java 17 bytecode; JDK 21 only runs Gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing Android signing secret."
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          def clean(value: str) -> str:
              return value.strip().strip('"').strip("'")

          def prop(value: str) -> str:
              return value.replace("\\", "\\\\")

          store_password = clean(os.environ["ANDROID_KEYSTORE_PASSWORD"])
          key_password = clean(os.environ["ANDROID_KEY_PASSWORD"])
          alias = clean(os.environ["ANDROID_KEY_ALIAS"])
          keystore = os.environ["KEYSTORE_PATH"]

          Path("android/app/key.properties").write_text("\n".join([
              f"storePassword={prop(store_password)}",
              f"keyPassword={prop(key_password)}",
              f"keyAlias={prop(alias)}",
              f"storeFile={keystore}",
          ]) + "\n")

          listed = subprocess.run(
              ["keytool", "-list", "-keystore", keystore, "-storepass", store_password],
              capture_output=True,
              text=True,
          )
          if listed.returncode != 0:
              print("Could not open the upload keystore.")
              print("ANDROID_KEYSTORE_PASSWORD does not match ANDROID_KEYSTORE_BASE64, or that secret is not a keystore.")
              for line in listed.stderr.splitlines():
                  if "storepass" in line.lower() or store_password in line:
                      continue
                  print(line)
              sys.exit(1)

          aliases = []
          lines = listed.stdout.splitlines()
          for index, line in enumerate(lines):
              if "PrivateKeyEntry" not in line:
                  continue
              name = line.split(",", 1)[0].strip()
              fingerprint = ""
              for follow in lines[index + 1:index + 4]:
                  if "SHA-256" in follow:
                      fingerprint = follow.split(":", 1)[-1].strip()
                      break
              aliases.append((name, fingerprint))

          print("Keys in the uploaded keystore:")
          for name, fingerprint in aliases:
              print(f"  {name}")
              if fingerprint:
                  print(f"    SHA-256 {fingerprint}")

          if alias not in [name for name, _ in aliases]:
              print("ANDROID_KEY_ALIAS is not one of those keys.")
              print("Set it to upscwarskey, and set ANDROID_KEYSTORE_BASE64 from /Users/sachin/dev-work/imp/kickel_key.")
              sys.exit(1)

          unlocked = subprocess.run(
              ["keytool", "-list", "-keystore", keystore, "-alias", alias, "-storepass", store_password, "-keypass", key_password],
              capture_output=True,
              text=True,
          )
          if unlocked.returncode != 0:
              print(f"ANDROID_KEY_PASSWORD cannot read the {alias} key.")
              sys.exit(1)
          print(f"Signing key {alias} is ready.")
          PY

      - name: Write dart defines
        env:
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ENABLE_TEST_SERIES: ${{ vars.ENABLE_TEST_SERIES }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_KEY is empty. The bundle will build, but Play purchases stay disabled."
          fi
          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "::warning::POSTHOG_API_KEY is empty. PostHog stays disabled in this bundle."
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          host = os.environ.get("POSTHOG_HOST") or "https://us.i.posthog.com"
          test_series = os.environ.get("ENABLE_TEST_SERIES") or "false"
          Path("dart_defines.json").write_text(json.dumps({
              "REVENUECAT_ANDROID_KEY": os.environ.get("REVENUECAT_ANDROID_KEY", ""),
              "POSTHOG_API_KEY": os.environ.get("POSTHOG_API_KEY", ""),
              "POSTHOG_HOST": host,
              "ENABLE_TEST_SERIES": test_series,
          }) + "\n")
          PY

      - name: Build the question database
        run: python3 tools/build_question_db.py assets/db/upsc_wars_questions.db

      - name: Install dependencies
        run: flutter pub get

      - name: Build Play App Bundle
        run: flutter build appbundle --release --dart-define-from-file=dart_defines.json

      - name: Upload the bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: play-appbundle-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/mapping/release/mapping.txt

      - name: Upload to Play production
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: bundle exec fastlane android upload

  ios:
    if: >-
      github.event.pull_request.merged == true ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'ios' || inputs.platform == 'both'))
    runs-on: macos-latest
    steps:
      - name: Require a merge commit
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ github.event.pull_request.merge_commit_sha }}" ]; then
            echo "This merge did not create a merge commit."
            echo "Merge into release with a merge commit or squash merge."
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true

      # The macOS image ships a CocoaPods built for a different Ruby than setup-ruby.
      # Install one into its own gem home. Fastlane points `pod` at that home
      # before Flutter runs, because bundle exec would hide it.
      - name: Install CocoaPods
        run: |
          gem_home="$RUNNER_TEMP/cocoapods-gems"
          gem install cocoapods --no-document --install-dir "$gem_home"
          echo "COCOAPODS_GEM_HOME=$gem_home" >> "$GITHUB_ENV"
          echo "$gem_home/bin" >> "$GITHUB_PATH"
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" "$gem_home/bin/pod" --version

      - name: Write dart defines
        env:
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ENABLE_TEST_SERIES: ${{ vars.ENABLE_TEST_SERIES }}
        run: |
          if [ -z "$REVENUECAT_ANDROID_KEY" ]; then
            echo "::warning::REVENUECAT_ANDROID_KEY is empty. The bundle will build, but Play purchases stay disabled."
          fi
          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "::warning::POSTHOG_API_KEY is empty. PostHog stays disabled in this bundle."
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          host = os.environ.get("POSTHOG_HOST") or "https://us.i.posthog.com"
          test_series = os.environ.get("ENABLE_TEST_SERIES") or "false"
          Path("dart_defines.json").write_text(json.dumps({
              "REVENUECAT_ANDROID_KEY": os.environ.get("REVENUECAT_ANDROID_KEY", ""),
              "POSTHOG_API_KEY": os.environ.get("POSTHOG_API_KEY", ""),
              "POSTHOG_HOST": host,
              "ENABLE_TEST_SERIES": test_series,
          }) + "\n")
          PY

      - name: Build the question database
        run: python3 tools/build_question_db.py assets/db/upsc_wars_questions.db

      - name: Install dependencies
        run: flutter pub get

      - name: Install the App Store certificate and profiles
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISION_PROFILE_BASE64 }}
        run: python3 fastlane/install_ios_signing.py

      - name: Submit to the App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane ios upload

      - name: Upload the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-ipa-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: build/ios/ipa/*.ipa
